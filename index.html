/* ... 所有原有的 CSS 保持完全不变 ... */
:root {
--bg: #f0f0f0; --card: #ffffff; --text: #000000; --sub: #666666;
--line: #000000; --accent: #0000ff; --tab-bg: #e0e0e0; --tab-active: #ffffff;
--font: "Courier New", Courier, monospace;
--radius: 0px; --line-w: 2px; --shadow: 4px 4px 0 #000;
--noise: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAAXNSR0IArs4c6QAAACVJREFUGFdjZGBg+M/AwMDIwMDAwMDAwMDAwMDAwMDAwMDAwMAAAA4AAf8B1kIAAAAASUVORK5CYII=');
}
body.theme-mono { --bg: #d0d0d0; --card: #ffffff; --text: #000000; --sub: #333333; --line: #000000; --accent: #000000; --tab-bg: #b0b0b0; --tab-active: #ffffff; --shadow: 3px 3px 0 #555; }
body.theme-yellow { --bg: #f4efd7; --card: #f9f7eb; --text: #3a3125; --sub: #7a6e5d; --line: #3a3125; --accent: #c58b00; --tab-bg: #e6dfc4; --tab-active: #f9f7eb; --shadow: 3px 3px 0 #3a3125; }
body.theme-brown { --bg: #f2e8d5; --card: #f7f2e8; --text: #4a2e15; --sub: #8a6e55; --line: #4a2e15; --accent: #b05c24; --tab-bg: #e0d0b8; --tab-active: #f7f2e8; --shadow: 4px 4px 0 #4a2e15; }
body.theme-blue { --bg: #e6f0ff; --card: #ffffff; --text: #000066; --sub: #4d4d99; --line: #000066; --accent: #0066ff; --tab-bg: #cce0ff; --tab-active: #ffffff; --shadow: 3px 3px 0 #000066; }
body.theme-minimal { --bg: #f5f5f5; --card: #ffffff; --text: #333333; --sub: #999999; --line: #e0e0e0; --accent: #007aff; --tab-bg: #f5f5f5; --tab-active: #ffffff; --shadow: 0 2px 8px rgba(0,0,0,0.05); --line-w: 1px; --radius: 8px; --font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; --noise: none; }
body.theme-dark { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --sub: #888888; --line: #333333; --accent: #bb86fc; --tab-bg: #121212; --tab-active: #1e1e1e; --shadow: 0 2px 8px rgba(0,0,0,0.2); --line-w: 1px; --radius: 8px; --font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; --noise: none; }
body.theme-neon { --bg: #090a0f; --card: rgba(15, 20, 30, 0.85); --text: #00ffff; --sub: #ff00ff; --line: #ff00ff; --accent: #00ffff; --tab-bg: #000000; --tab-active: rgba(0, 255, 255, 0.1); --shadow: 0 0 15px rgba(255, 0, 255, 0.4), 0 0 30px rgba(0, 255, 255, 0.2); --line-w: 2px; --radius: 12px; --font: 'Courier New', Courier, monospace; --noise: none; }
body.theme-neon::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px); background-size: 40px 40px; }
body.theme-neon .main-title { text-shadow: 0 0 10px var(--accent), 0 0 20px var(--line); }
body.theme-neon .book-content { backdrop-filter: blur(10px); border-color: var(--accent); }
body.theme-neon .book-tab.on { box-shadow: inset 0 0 10px var(--accent), 0 0 10px var(--line); text-shadow: 0 0 5px var(--accent); border-color: var(--accent); }
body.theme-neon .btn { box-shadow: 0 0 5px var(--line); transition: all 0.2s; }
body.theme-neon .btn:hover { box-shadow: 0 0 15px var(--accent); background: var(--accent); color: #000; }
body.theme-neon .btn.primary { box-shadow: 0 0 15px var(--accent); border-color: var(--accent); color: #000; }
body.theme-neon .avatar-box { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); border-radius: 50%; }
body.theme-neon .attr-fill { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
body.theme-neon .ck-box { border-color: var(--accent); border-radius: 50%; }
body.theme-neon .ck-box.done { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

• { box-sizing: border-box; -webkit-touch-callout: none; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; transition: background .2s; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; background-image: var(--noise); opacity: 0.1; }
/* 🌟 核心2：适配底部手势条安全区 */
.wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px calc(80px + env(safe-area-inset-bottom)); min-height: 100vh; display: flex; flex-direction: column; }
.header { text-align: center; margin-bottom: 24px; position: relative; display: flex; flex-direction: column; align-items: center; }
.main-title { font-size: 1.8em; font-weight: bold; letter-spacing: 4px; margin: 0 0 8px 0; }
.date-time-row { display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 0.95em; letter-spacing: 2px; }
.sub-date { cursor: pointer; display: inline-block; margin-bottom: 4px; }
.sub-date:hover { color: var(--accent); }
.time-display { font-weight: bold; color: var(--accent); }
.top-btns { position: absolute; right: 0; top: 0; }

.book-tabs-container { display: flex; align-items: flex-end; width: 100%; border-bottom: var(--line-w) solid var(--line); padding-left: 2px; position: relative; z-index: 2; }
.book-tab { flex: 1; text-align: center; padding: 12px 4px; border: var(--line-w) solid transparent; border-bottom: none; cursor: pointer; font-weight: bold; font-size: 1em; letter-spacing: 1px; color: var(--sub); background: transparent; transition: all .1s; }
.book-tab.on { background: var(--card); color: var(--text); border-color: var(--line); border-bottom: var(--line-w) solid var(--card); transform: translateY(var(--line-w)); box-shadow: inset 0 3px 0 var(--accent); }
.book-content { flex: 1; border: var(--line-w) solid var(--line); background: var(--card); padding: 20px; box-shadow: var(--shadow); position: relative; z-index: 1; overflow-y: auto; }
.tab-page { display: none; }
.tab-page.on { display: block; }

.field { margin-bottom: 12px; }
.field input, .field select, .field textarea { width: 100%; margin-top: 4px; padding: 8px; border: var(--line-w) solid var(--line); background: var(--bg); color: var(--text); font-family: inherit; outline: none; font-size: 16px; }
.btn { padding: 8px 16px; border: var(--line-w) solid var(--line); background: var(--card); color: var(--text); font-weight: bold; cursor: pointer; font-family: inherit; box-shadow: 2px 2px 0 var(--line); transition: all .1s; }
.btn:hover { background: var(--line); color: var(--bg); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--line); }

.list-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 2px dashed var(--sub); }
.ck-box { width: 20px; height: 20px; border: var(--line-w) solid var(--line); cursor: pointer; flex: 0 0 auto; background: var(--bg); }
.ck-box.done { background: var(--accent); }
.li-del { background: none; border: none; color: var(--sub); font-size: 1.2em; cursor: pointer; padding: 0 4px; }
.li-cal { background: none; border: none; color: var(--accent); font-size: 1.1em; cursor: pointer; padding: 0 4px; }

.progress-banner { text-align: center; padding: 12px; margin-bottom: 16px; background: var(--bg); border: var(--line-w) dashed var(--line); font-weight: bold; color: var(--accent); }
.progress-banner.done { background: var(--accent); color: #fff; border-style: solid; border-color: var(--accent); }

.hero-top { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.avatar-box { width: 90px; height: 90px; border: var(--line-w) solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 3.5em; cursor: pointer; overflow: hidden; background: var(--bg); box-shadow: var(--shadow); flex: 0 0 auto; }
.avatar-box img { width: 100%; height: 100%; object-fit: cover; }
.exp-bar { height: 12px; border: var(--line-w) solid var(--line); margin-top: 10px; background: var(--bg); }
.exp-fill { height: 100%; background: var(--accent); }

.streak-box { margin-left: auto; border: var(--line-w) solid var(--line); padding: 8px 10px; text-align: center; cursor: pointer; background: var(--bg); transition: all .2s; box-shadow: 2px 2px 0 var(--line); }
.streak-box:hover { background: var(--card); transform: translate(-1px, -1px); }
.streak-box .num { font-size: 1.4em; font-weight: bold; color: var(--accent); line-height: 1.1; }
.streak-box .txt { font-size: 0.7em; color: var(--sub); font-weight: bold; }

.attr-section { border-top: var(--line-w) solid var(--line); padding-top: 20px; margin-bottom: 24px; }
.attr-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.attr-name { width: 60px; font-weight: bold; font-size: 1.05em; }
.attr-track { flex: 1; height: 16px; border: var(--line-w) solid var(--line); background: var(--bg); }
.attr-fill { height: 100%; background: var(--text); }
.attr-stone { border-color: var(--accent); background: transparent; }
.attr-stone .attr-fill { background: var(--accent); }

.pet-section { border-top: var(--line-w) solid var(--line); padding-top: 16px; }
.pet-card { display: flex; gap: 16px; align-items: center; background: var(--bg); border: var(--line-w) dashed var(--line); padding: 12px; }
.pet-svg-container { width: 70px; height: 70px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: var(--card); border: var(--line-w) solid var(--line); position: relative; }
.pet-svg-container svg { width: 85%; height: 85%; }
.pet-status { flex: 1; }
.pet-stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: .85em; font-weight: bold; }
.pet-bar-bg { flex: 1; height: 8px; border: var(--line-w) solid var(--line); background: var(--card); }
.pet-bar-fill { height: 100%; transition: width .2s; }
.pet-bar-fill.hp { background: #d35400; }
.pet-bar-fill.mood { background: #f39c12; }
.pet-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
.pet-btn { font-size: .75em; padding: 4px 0; border: var(--line-w) solid var(--line); background: var(--card); cursor: pointer; font-weight: bold; color: var(--text); }
.pet-btn:hover { background: var(--line); color: var(--bg); }
.pet-bubble { background: var(--card); border: var(--line-w) solid var(--line); padding: 6px 10px; font-size: 0.8em; font-weight: bold; margin-bottom: 10px; display: inline-block; border-radius: 4px; position: relative; }
.pet-bubble::after { content: ""; position: absolute; bottom: -7px; left: 20px; border-width: 7px 7px 0; border-style: solid; border-color: var(--line) transparent transparent; }

.ach-section { border-top: var(--line-w) solid var(--line); padding-top: 16px; margin-top: 20px; }
.ach-header { font-weight: bold; text-transform: uppercase; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.ach-list { display: none; margin-top: 12px; max-height: 400px; overflow-y: auto; padding-right: 4px;}
.ach-item { border: var(--line-w) solid var(--line); padding: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; background: var(--bg); }
.ach-item.locked { opacity: 0.5; }

.chart-container { margin-top: 20px; border-top: var(--line-w) solid var(--line); padding-top: 16px; }
canvas { max-height: 200px; }

.dock { display: flex; gap: 12px; height: 60px; margin-top: 16px; }
.dock-side { width: 60px; border: var(--line-w) solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--card); box-shadow: var(--shadow); }
.dock-side svg { width: 28px; height: 28px; fill: var(--text); }
.dock-side.active { background: var(--line); }
.dock-side.active svg { fill: var(--bg); }
.dock-center { flex: 1; border: var(--line-w) solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2em; cursor: pointer; background: var(--card); box-shadow: var(--shadow); letter-spacing: 2px;}
.dock-center.active { background: var(--line); color: var(--bg); }

.shelf-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; scrollbar-width: none; }
.shelf-tabs::-webkit-scrollbar { display: none; }
.shelf-tab { padding: 4px 12px; border: var(--line-w) solid var(--line); border-radius: 20px; font-size: 0.85em; cursor: pointer; background: var(--bg); white-space: nowrap; }
.shelf-tab.on { background: var(--accent); color: #fff; }
.shelf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.shelf-book { border: var(--line-w) solid var(--line); padding: 6px; background: var(--bg); display: flex; flex-direction: column; cursor: pointer; transition: transform 0.1s; box-shadow: 2px 2px 0 var(--line); }
.shelf-book:active { transform: scale(0.96); }
.shelf-cover { width: 100%; aspect-ratio: 3/4; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 6px; }
.shelf-cover img { width: 100%; height: 100%; object-fit: cover; }
.shelf-title { font-size: 0.8em; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shelf-progress { height: 4px; background: var(--card); border: 1px solid var(--line); margin-top: 4px; }
.shelf-progress-fill { height: 100%; background: var(--accent); }

.folder-wrapper { margin-bottom: 12px; display: flex; align-items: flex-start; gap: 8px; }
.folder-bar { display: flex; gap: 8px; flex: 1; overflow: auto; }
.folder-bar.vertical { flex-direction: column; overflow-x: hidden; }
.folder-bar.list .folder-btn { width: 100%; justify-content: flex-start; padding: 8px 12px; }
.folder-btn { padding: 4px 10px; border: var(--line-w) solid var(--line); background: var(--bg); font-size: 0.85em; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.folder-btn.on { background: var(--text); color: var(--bg); }
.layout-toggle { padding: 4px 8px; border: var(--line-w) solid var(--line); background: var(--card); cursor: pointer; font-size: 0.85em; font-weight: bold; }

.note-item { border-bottom: 1px dashed var(--line); padding: 12px 0; cursor: pointer; }
.note-item:hover { background: rgba(0,0,0,0.02); }
.note-date { font-size: 0.75em; color: var(--sub); }

.note-editor { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: none; flex-direction: column; }
.note-editor.on { display: flex; }
.note-editor-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: var(--line-w) solid var(--line); background: var(--card); }
.note-editor-header select { padding: 4px; border: var(--line-w) solid var(--line); background: transparent; font-family: inherit;}
.note-editor-textarea { flex: 1; width: 100%; padding: 20px; border: none; background: var(--bg); color: var(--text); font-size: 1.1em; font-family: inherit; outline: none; resize: none; line-height: 1.6; }
.save-status { font-size: 0.8em; color: var(--sub); margin-right: 12px; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;}
.modal.on { display: flex; }
.modal-box { background: var(--card); padding: 20px; border: var(--line-w) solid var(--line); width: 100%; max-width: 400px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto;}
.modal-title { margin-top: 0; border-bottom: var(--line-w) solid var(--line); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.stat-card { border: var(--line-w) solid var(--line); padding: 12px; text-align: center; background: var(--bg); }
.stat-val { font-size: 1.8em; font-weight: bold; color: var(--accent); margin-bottom: 4px; }
.stat-lbl { font-size: 0.8em; color: var(--sub); }

.pet-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pet-opt-btn { border: var(--line-w) solid var(--line); background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 10px; cursor: pointer; transition: 0.2s; box-shadow: 2px 2px 0 var(--line); }
.pet-opt-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); }
.pet-opt-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.pet-opt-svg { width: 50px; height: 50px; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="wrap">
<div class="header">
<div class="top-btns">
<button class="btn" onclick="openModal('modalSetting')" title="设置" style="padding:4px 8px;">⚙</button>
</div>
<h1 class="main-title" id="appTitle">反派的自我修养</h1>
<div class="date-time-row">
<span class="sub-date" id="dateDisplay" onclick="showAlmanac()">加载日期中...</span>
<span class="time-display" id="timeDisplay">子时</span>
</div>
</div>

<div class="book-tabs-container">
<button class="book-tab on" onclick="switchTab('hero')" id="tab-hero">人物</button>
<button class="book-tab" onclick="switchTab('daily')" id="tab-daily">日常</button>
<button class="book-tab" onclick="switchTab('weekly')" id="tab-weekly">周常</button>
<button class="book-tab" onclick="switchTab('temp')" id="tab-temp">临时</button>
</div>

<div class="book-content">
<div class="tab-page on" id="page-hero">
<div class="hero-top">
<div class="avatar-box" id="heroAvatar" onclick="openModal('modalFace')">🧑‍🚀</div>
<div style="flex:1">
<div style="font-size:1.5em;font-weight:bold" id="heroName">反派</div>
<div style="font-size:1em;color:var(--sub)" id="heroLevel">Lv.1 · 初出茅庐</div>
<div class="exp-bar"><div class="exp-fill" id="expFill" style="width:0%"></div></div>
</div>
<div class="streak-box" onclick="showStats()">
<div class="num" id="streakNum">0</div>
<div class="txt">打卡天数</div>
</div>
</div>

<div class="attr-section">
<div style="font-weight:bold; font-size:1.1em; margin-bottom:16px; text-transform:uppercase;">我的属性</div>
<div id="attrsContainer"></div>
</div>

<div class="pet-section">
<div style="font-weight:bold; margin-bottom:12px; display:flex; justify-content:space-between; text-transform:uppercase;">
<span>我的宠物</span>
<button class="btn" style="padding:2px 8px; font-size:.8em" onclick="openModal('modalPet')">更换</button>
</div>
<div style="text-align:left;">
<div class="pet-bubble" id="petBubble">今天也要努力哦！</div>
</div>
<div class="pet-card">
<div class="pet-svg-container" id="petIconBox"></div>
<div class="pet-status">
<div class="pet-stat-row"><span>HP</span><div class="pet-bar-bg"><div class="pet-bar-fill hp" id="petHpBar"></div></div></div>
<div class="pet-stat-row"><span>MP</span><div class="pet-bar-bg"><div class="pet-bar-f
